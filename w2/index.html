<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？美食隨機抽籤機</title>
    <!-- 引入 Google Fonts 可愛字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================================
           1. 變數與整體設定 (柔和粉紫風格)
           ================================ */
        :root {
            --primary-purple: #9d4edd;
            --light-purple: #c77dff;
            --soft-pink: #ffb703;
            --bg-pink: #ffe5ec;
            --card-bg: #ffffff;
            --text-dark: #4a3e56;
            --text-muted: #8a7a9b;
            --accent-yellow: #ffb703;
            --accent-pink: #ff85a1;
            --radius-lg: 28px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --shadow-soft: 0 15px 35px rgba(157, 78, 221, 0.15);
            --shadow-hover: 0 20px 40px rgba(157, 78, 221, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e8ff 0%, #ffe5ec 50%, #f0e6ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
        }

        /* ================================
           2. 背景浮動可愛圖示裝飾
           ================================ */
        .bg-decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }

        .decor {
            position: absolute;
            color: rgba(199, 125, 255, 0.25);
            animation: float 6s ease-in-out infinite;
        }

        .decor-1 { top: 10%; left: 8%; font-size: 2.5rem; animation-delay: 0s; }
        .decor-2 { top: 20%; right: 10%; font-size: 3rem; animation-delay: 1.5s; }
        .decor-3 { bottom: 15%; left: 12%; font-size: 2.8rem; animation-delay: 3s; }
        .decor-4 { bottom: 20%; right: 8%; font-size: 2.2rem; animation-delay: 4.5s; }
        .decor-5 { top: 50%; left: 3%; font-size: 2rem; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(10deg); }
        }

        /* ================================
           3. 主卡片容器
           ================================ */
        .card-container {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-soft);
            border: 3px solid #ffffff;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* 頂部 Badge */
        .badge {
            background: #f3e8ff;
            color: var(--primary-purple);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* 大標題 */
        #main-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-purple);
            margin-bottom: 10px;
            line-height: 1.3;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* ================================
           4. 圖片展示區塊
           ================================ */
        .image-container {
            width: 100%;
            height: 220px;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 4px solid #fff;
            background: #f8f0fc;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-container:hover img {
            transform: scale(1.05);
        }

        .image-overlay {
            position: absolute;
            bottom: 12px;
            right: 12px;
        }

        .food-tag {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-purple);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
        }

        /* ================================
           5. 按鈕設計
           ================================ */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        /* 抽籤按鈕 */
        .primary-btn {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.35);
        }

        .primary-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(168, 85, 247, 0.45);
        }

        .primary-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* 馬上出發按鈕 */
        .map-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.3);
            animation: popIn 0.4s ease forwards;
        }

        .map-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 25px rgba(6, 182, 212, 0.4);
        }

        /* ================================
           6. 美食清單編輯區 (折疊選單)
           ================================ */
        .list-management {
            border-top: 2px dashed #f0e6ff;
            padding-top: 15px;
            margin-top: 10px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .toggle-btn:hover {
            color: var(--primary-purple);
            background: #f8f0fc;
        }

        .list-content {
            margin-top: 15px;
            text-align: left;
        }

        .add-item-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .add-item-form input {
            flex: 1;
            min-width: 120px;
            padding: 8px 12px;
            border: 2px solid #e9d5ff;
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 0.85rem;
        }

        .add-item-form input:focus {
            border-color: var(--primary-purple);
        }

        .small-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            background: var(--primary-purple);
            color: white;
            border-radius: var(--radius-sm);
        }

        .food-list {
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .food-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #fbf8ff;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .delete-btn {
            color: #f43f5e;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 8px;
        }

        /* ================================
           7. 動畫特效
           ================================ */
        .hidden {
            display: none !important;
        }

        /* 標題生動彈跳登場 */
        .bounce-animation {
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(-20px);
            }
            50% {
                opacity: 1;
                transform: scale(1.15) translateY(5px);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1) translateY(0);
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- 背景裝飾浮動元素 -->
    <div class="bg-decorations">
        <i class="fa-solid fa-utensils decor decor-1"></i>
        <i class="fa-solid fa-burger decor decor-2"></i>
        <i class="fa-solid fa-pizza-slice decor decor-3"></i>
        <i class="fa-solid fa-bowl-food decor decor-4"></i>
        <i class="fa-solid fa-ice-cream decor decor-5"></i>
    </div>

    <div class="card-container">
        <!-- 主標題區塊 -->
        <div class="header-section">
            <span class="badge">美食指南 ✦ Decision Maker</span>
            <h1 id="main-title" class="title-bounce">今天吃什麼？</h1>
            <p id="sub-title" class="sub-title">解決選擇困難症！點擊下方按鈕讓命運來決定吧～</p>
        </div>

        <!-- 圖片展示區塊 (預設隱藏) -->
        <div id="image-container" class="image-container hidden">
            <img id="food-image" src="" alt="美食照片">
            <div class="image-overlay">
                <span id="food-tag" class="food-tag">美味首選</span>
            </div>
        </div>

        <!-- 按鈕區塊 -->
        <div class="action-buttons">
            <button id="draw-btn" class="btn primary-btn">
                <i class="fa-solid fa-dice"></i> 點我抽籤！
            </button>
            <a id="map-btn" class="btn map-btn hidden" href="#" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-location-dot"></i> 馬上出發！
            </a>
        </div>

        <!-- 可折疊：選單管理區塊 -->
        <div class="list-management">
            <button id="toggle-list-btn" class="toggle-btn">
                <i class="fa-solid fa-list-check"></i> 查看 / 編輯美食清單 (<span id="item-count">5</span>)
            </button>
            
            <div id="list-content" class="list-content hidden">
                <div class="add-item-form">
                    <input type="text" id="new-name" placeholder="餐廳名稱">
                    <input type="text" id="new-img" placeholder="圖片網址 (選填)">
                    <button id="add-btn" class="btn small-btn"><i class="fa-solid fa-plus"></i> 新增</button>
                </div>
                <ul id="food-list" class="food-list">
                    <!-- 動態加入項目 -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 確保 DOM 載入後執行
        document.addEventListener('DOMContentLoaded', () => {
            
            // 您上傳真實照片的指定清單
            const defaultFoodList = [
                {
                    name: '左松禾壽司',
                    image: 'https://i.postimg.cc/V63dF8qr/IMG20260606125031.jpg'
                },
                {
                    name: '麻辣風暴',
                    image: 'https://i.postimg.cc/L8hNJk83/IMG20241210181849.jpg'
                },
                {
                    name: '深坑麻辣鴨血臭豆腐',
                    image: 'https://i.postimg.cc/3xyF8KL3/IMG20260308212401.jpg'
                },
                {
                    name: '六扇門',
                    image: 'https://i.postimg.cc/bvxbrdkk/IMG20260613193037.jpg'
                },
                {
                    name: '瑞克夜宵',
                    image: 'https://i.postimg.cc/63H84Z3z/IMG20260920011147.jpg'
                }
            ];

            // 讀取快取；如快取不存在或資料不對則使用指定照片清單
            let savedFoods = JSON.parse(localStorage.getItem('my_food_list_v2'));
            let foods = (savedFoods && savedFoods.length > 0) ? savedFoods : defaultFoodList;

            // DOM 元素選取
            const mainTitle = document.getElementById('main-title');
            const subTitle = document.getElementById('sub-title');
            const drawBtn = document.getElementById('draw-btn');
            const mapBtn = document.getElementById('map-btn');
            const imageContainer = document.getElementById('image-container');
            const foodImage = document.getElementById('food-image');
            const toggleListBtn = document.getElementById('toggle-list-btn');
            const listContent = document.getElementById('list-content');
            const foodListUI = document.getElementById('food-list');
            const addBtn = document.getElementById('add-btn');
            const newNameInput = document.getElementById('new-name');
            const newImgInput = document.getElementById('new-img');
            const itemCountSpan = document.getElementById('item-count');

            let isSpinning = false;

            // 渲染清單
            function renderList() {
                foodListUI.innerHTML = '';
                itemCountSpan.textContent = foods.length;

                foods.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>${item.name}</span>
                        <button class="delete-btn" onclick="deleteFood(${index})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    foodListUI.appendChild(li);
                });

                localStorage.setItem('my_food_list_v2', JSON.stringify(foods));
            }

            // 刪除項目功能
            window.deleteFood = function(index) {
                if (foods.length <= 1) {
                    alert('清單至少要保留一個選項喔！');
                    return;
                }
                foods.splice(index, 1);
                renderList();
            };

            // 抽籤邏輯
            function startRandomDraw() {
                if (isSpinning) return;
                if (foods.length === 0) {
                    alert('請先新增美食項目！');
                    return;
                }

                isSpinning = true;
                drawBtn.disabled = true;
                drawBtn.style.opacity = '0.7';

                mainTitle.classList.remove('bounce-animation');
                mapBtn.classList.add('hidden');

                let counter = 0;
                const totalRolls = 20;
                const speed = 80;

                const interval = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * foods.length);
                    mainTitle.textContent = foods[randomIndex].name;
                    counter++;

                    if (counter >= totalRolls) {
                        clearInterval(interval);
                        finishDraw();
                    }
                }, speed);
            }

            // 完成抽籤
            function finishDraw() {
                const selectedFood = foods[Math.floor(Math.random() * foods.length)];

                mainTitle.textContent = selectedFood.name;
                mainTitle.classList.add('bounce-animation');
                subTitle.textContent = ' 🎉 太棒了！今天就決定吃這個：';

                // 顯示您所設定的專屬照片網址
                if (selectedFood.image) {
                    foodImage.src = selectedFood.image;
                    imageContainer.classList.remove('hidden');
                } else {
                    imageContainer.classList.add('hidden');
                }

                const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedFood.name)}`;
                mapBtn.href = googleMapUrl;
                mapBtn.classList.remove('hidden');

                isSpinning = false;
                drawBtn.disabled = false;
                drawBtn.style.opacity = '1';
            }

            // 綁定事件
            drawBtn.addEventListener('click', startRandomDraw);

            toggleListBtn.addEventListener('click', () => {
                listContent.classList.toggle('hidden');
            });

            addBtn.addEventListener('click', () => {
                const name = newNameInput.value.trim();
                const image = newImgInput.value.trim();

                if (!name) {
                    alert('請輸入餐廳名稱！');
                    return;
                }

                foods.push({ name, image });
                renderList();

                newNameInput.value = '';
                newImgInput.value = '';
            });

            renderList();
        });
    </script>
</body>
</html>
