<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特級咒物：二選一裁決</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #050505;
      background-image: radial-gradient(circle at center, #1a0b2e 0%, #050505 100%);
      color: #e5e7eb;
    }
    .jujutsu-border {
      border: 2px solid #6b21a8;
      box-shadow: 0 0 15px rgba(107, 33, 168, 0.7), inset 0 0 10px rgba(107, 33, 168, 0.5);
    }
    .btn-curse {
      background: linear-gradient(135deg, #4c1d95 0%, #7e22ce 100%);
      transition: all 0.3s;
      border: 1px solid #a855f7;
    }
    .btn-curse:hover {
      box-shadow: 0 0 20px #a855f7;
      transform: scale(1.02);
    }
    .btn-vote {
      transition: all 0.3s;
      filter: grayscale(30%);
    }
    .btn-vote:hover {
      filter: grayscale(0%) drop-shadow(0 0 15px #dc2626);
      transform: scale(1.05);
      border-color: #ef4444;
    }
    /* 隱藏彩蛋觸發區：右上角 */
    .domain-expansion-trigger {
      position: absolute;
      top: 0;
      right: 0;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
    .glitch {
      animation: glitch 1s linear infinite;
    }
    @keyframes glitch {
      2%, 64% { transform: translate(2px,0) skew(0deg); }
      4%, 60% { transform: translate(-2px,0) skew(0deg); }
      62% { transform: translate(0,0) skew(5deg); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- 系統主體 -->
  <div class="relative w-full max-w-md bg-black/80 rounded-xl p-6 jujutsu-border backdrop-blur-sm">
    <!-- 隱藏開票彩蛋（領域展開） -->
    <div class="domain-expansion-trigger" onclick="triggerDomainExpansion()" title="隱藏彩蛋"></div>

    <h1 class="text-3xl font-black text-center text-purple-400 mb-6 tracking-widest drop-shadow-[0_0_10px_rgba(168,85,247,0.8)]">二選一裁決</h1>

    <!-- 建立投票視圖 (立下束縛) -->
    <div id="create-view" class="hidden flex-col gap-4">
      <h2 class="text-xl font-bold text-center border-b border-purple-800 pb-2 mb-2">立下束縛（建立投票）</h2>
      
      <input type="text" id="poll-title" placeholder="輸入裁決主題 (例如: 晚餐吃啥)" class="w-full bg-gray-900 border border-purple-700 rounded p-3 text-white focus:outline-none focus:border-purple-400">
      
      <div class="flex gap-4">
        <!-- 照片 A -->
        <div class="flex-1 flex flex-col items-center gap-2">
          <label class="w-full aspect-square border-2 border-dashed border-gray-600 rounded flex flex-col items-center justify-center cursor-pointer hover:border-purple-500 overflow-hidden relative text-gray-400">
            <span id="preview-text-A">📷 照片 A</span>
            <img id="preview-A" class="hidden absolute inset-0 w-full h-full object-cover">
            <input type="file" accept="image/*" class="hidden" onchange="handleImage(this, 'A')">
          </label>
        </div>
        <!-- 照片 B -->
        <div class="flex-1 flex flex-col items-center gap-2">
          <label class="w-full aspect-square border-2 border-dashed border-gray-600 rounded flex flex-col items-center justify-center cursor-pointer hover:border-purple-500 overflow-hidden relative text-gray-400">
            <span id="preview-text-B">📷 照片 B</span>
            <img id="preview-B" class="hidden absolute inset-0 w-full h-full object-cover">
            <input type="file" accept="image/*" class="hidden" onchange="handleImage(this, 'B')">
          </label>
        </div>
      </div>

      <div class="mt-2">
        <label class="block text-sm text-purple-300 mb-1">裁決截止時間：</label>
        <input type="datetime-local" id="poll-deadline" class="w-full bg-gray-900 border border-purple-700 rounded p-3 text-white focus:outline-none focus:border-purple-400">
      </div>

      <button onclick="createPoll()" class="mt-4 w-full py-3 rounded font-bold text-lg btn-curse text-white tracking-widest">
        布下帳（建立）
      </button>
    </div>

    <!-- 投票視圖 (注入咒力) -->
    <div id="vote-view" class="hidden flex-col gap-4">
      <h2 id="vote-title" class="text-2xl font-bold text-center text-white mb-2"></h2>
      
      <div class="text-center text-red-500 font-bold bg-red-950/50 rounded py-2 border border-red-900 mb-2">
        剩餘時間：<span id="countdown" class="tracking-widest">載入中...</span>
      </div>

      <div class="flex gap-4">
        <!-- 投票 A -->
        <div class="flex-1 flex flex-col items-center gap-2">
          <button onclick="submitVote('A')" class="w-full aspect-square p-0 border-2 border-transparent rounded overflow-hidden btn-vote relative">
            <img id="vote-img-A" class="w-full h-full object-cover">
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black to-transparent p-2 text-center font-bold text-white">選 A</div>
          </button>
        </div>
        <!-- 投票 B -->
        <div class="flex-1 flex flex-col items-center gap-2">
          <button onclick="submitVote('B')" class="w-full aspect-square p-0 border-2 border-transparent rounded overflow-hidden btn-vote relative">
            <img id="vote-img-B" class="w-full h-full object-cover">
            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black to-transparent p-2 text-center font-bold text-white">選 B</div>
          </button>
        </div>
      </div>
    </div>

    <!-- 結果視圖 (受胎九相圖) -->
    <div id="result-view" class="hidden flex-col gap-4">
      <h2 class="text-2xl font-bold text-center text-red-500 mb-2 glitch">領域已解除 (裁決結果)</h2>
      <h3 id="result-title" class="text-xl text-center text-white mb-4"></h3>

      <div class="space-y-4">
        <div class="relative w-full bg-gray-800 rounded p-4 border border-gray-700 flex items-center justify-between">
          <img id="res-img-A" class="w-16 h-16 object-cover rounded shadow-lg border border-purple-500">
          <div class="flex-1 px-4">
            <div class="flex justify-between mb-1">
              <span class="font-bold">選項 A</span>
              <span id="res-votes-A" class="font-black text-purple-400">0 票</span>
            </div>
            <div class="w-full bg-gray-900 h-3 rounded-full overflow-hidden">
              <div id="bar-A" class="bg-purple-600 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div class="relative w-full bg-gray-800 rounded p-4 border border-gray-700 flex items-center justify-between">
          <img id="res-img-B" class="w-16 h-16 object-cover rounded shadow-lg border border-red-500">
          <div class="flex-1 px-4">
            <div class="flex justify-between mb-1">
              <span class="font-bold">選項 B</span>
              <span id="res-votes-B" class="font-black text-red-400">0 票</span>
            </div>
            <div class="w-full bg-gray-900 h-3 rounded-full overflow-hidden">
              <div id="bar-B" class="bg-red-600 h-full transition-all duration-1000" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>
      
      <button onclick="window.location.href=window.location.pathname" class="mt-6 w-full py-2 rounded text-sm text-gray-400 border border-gray-600 hover:bg-gray-800 transition">
        發起新裁決
      </button>
    </div>

  </div>

  <!-- Loading 遮罩 -->
  <div id="loading" class="hidden fixed inset-0 bg-black/90 flex flex-col justify-center items-center z-50">
    <div class="w-16 h-16 border-4 border-purple-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-purple-500 text-2xl font-bold tracking-widest drop-shadow-[0_0_8px_#a855f7]">咒力轉化中...</div>
  </div>

  <script>
    // 你的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyuZtLDSKo34HvQFEp_bdh0S4GMFRWWrfOSq-YJi5E_jyysX3MDLUxNdGfQK0evtB-U/exec";
    
    // 全域變數
    let currentPollId = null;
    let base64ImgA = null;
    let base64ImgB = null;
    let timerInterval = null;
    let pollDataCache = null;

    // 路由與初始化
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentPollId = urlParams.get('poll');
      
      if (currentPollId) {
        loadPollData();
      } else {
        document.getElementById('create-view').classList.remove('hidden');
        document.getElementById('create-view').classList.add('flex');
        
        // 預設截止時間為明天
        const tmr = new Date();
        tmr.setDate(tmr.getDate() + 1);
        tmr.setHours(12, 0, 0, 0);
        document.getElementById('poll-deadline').value = new Date(tmr.getTime() - tmr.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      }
    };

    // UI 切換輔助函數
    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'flex' : 'none';
    }
    
    function switchView(viewId) {
      ['create-view', 'vote-view', 'result-view'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.add('hidden');
        el.classList.remove('flex');
      });
      document.getElementById(viewId).classList.remove('hidden');
      document.getElementById(viewId).classList.add('flex');
    }

    // Canvas 圖片壓縮與 1:1 裁切 (核心技術)
    function handleImage(input, type) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 800; // 固定輸出 800x800
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          
          // 計算 1:1 裁切比例
          const minSize = Math.min(img.width, img.height);
          const sx = (img.width - minSize) / 2;
          const sy = (img.height - minSize) / 2;
          
          ctx.drawImage(img, sx, sy, minSize, minSize, 0, 0, size, size);
          const base64 = canvas.toDataURL('image/jpeg', 0.8);
          
          if (type === 'A') {
            base64ImgA = base64;
            document.getElementById('preview-A').src = base64;
            document.getElementById('preview-A').classList.remove('hidden');
            document.getElementById('preview-text-A').classList.add('hidden');
          } else {
            base64ImgB = base64;
            document.getElementById('preview-B').src = base64;
            document.getElementById('preview-B').classList.remove('hidden');
            document.getElementById('preview-text-B').classList.add('hidden');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 建立投票 (POST)
    async function createPoll() {
      const title = document.getElementById('poll-title').value.trim();
      const deadline = document.getElementById('poll-deadline').value;

      if (!title || !base64ImgA || !base64ImgB || !deadline) {
        alert("束縛條件不足：請填寫主題並上傳兩張照片！");
        return;
      }

      showLoading(true);
      const pollId = 'P' + Date.now();

      const payload = {
        action: "create",
        pollId: pollId,
        title: title,
        imgA: base64ImgA,
        imgB: base64ImgB,
        deadline: new Date(deadline).toISOString()
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (res.success) {
          alert("帳已成功降下！即將為您產生專屬分享連結。");
          // 導向專屬網址
          window.location.href = `?poll=${pollId}`;
        }
      } catch (err) {
        alert("咒力暴走 (錯誤)：" + err.message);
      } finally {
        showLoading(false);
      }
    }

    // 讀取投票資訊 (GET)
    async function loadPollData() {
      showLoading(true);
      try {
        const res = await fetch(`${GAS_URL}?poll=${currentPollId}`).then(r => r.json());
        if (res.error) {
          alert(res.error);
          window.location.href = window.location.pathname;
          return;
        }

        pollDataCache = res;
        const now = new Date();
        const deadline = res.deadline ? new Date(res.deadline) : null;
        const isExpired = deadline && (now >= deadline);

        // 如果已開票或時間已到，顯示結果
        if (res.status === 'revealed' || isExpired) {
          showResult(res);
        } else {
          // 顯示投票介面
          document.getElementById('vote-title').textContent = res.title;
          document.getElementById('vote-img-A').src = res.imgA;
          document.getElementById('vote-img-B').src = res.imgB;
          startCountdown(deadline);
          switchView('vote-view');
        }
      } catch (err) {
        alert("結界讀取失敗：" + err.message);
      } finally {
        showLoading(false);
      }
    }

    // 倒數計時邏輯
    function startCountdown(deadline) {
      if (!deadline) return;
      const el = document.getElementById('countdown');
      
      timerInterval = setInterval(() => {
        const now = new Date().getTime();
        const distance = deadline.getTime() - now;

        if (distance < 0) {
          clearInterval(timerInterval);
          el.innerHTML = "時間已盡，領域展開！";
          loadPollData(); // 重新讀取顯示結果
          return;
        }

        const d = Math.floor(distance / (1000 * 60 * 60 * 24));
        const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((distance % (1000 * 60)) / 1000);

        el.innerHTML = `${d}天 ${h}時 ${m}分 ${s}秒`;
      }, 1000);
    }

    // 進行投票 (POST)
    async function submitVote(choice) {
      showLoading(true);
      const payload = {
        action: "vote",
        pollId: currentPollId,
        choice: choice
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (res.success) {
          alert(`已注入咒力至選項 ${choice}！`);
          loadPollData(); // 重新讀取顯示結果
        } else {
          alert(res.error || "投票失敗");
        }
      } catch (err) {
        alert("咒力受阻：" + err.message);
      } finally {
        showLoading(false);
      }
    }

    // 隱藏彩蛋：房主提前開票 (右上角點擊)
    async function triggerDomainExpansion() {
      if (!currentPollId || !pollDataCache) return;
      if (pollDataCache.status === 'revealed') return;

      const confirmReveal = confirm("⚠️ 警告：即將強制展開領域（提前開票）。開票後將無法繼續投票。是否執行？");
      if (!confirmReveal) return;

      showLoading(true);
      const payload = {
        action: "reveal",
        pollId: currentPollId
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        }).then(r => r.json());

        if (res.success) {
          alert("領域展開！裁決結果已揭曉。");
          loadPollData();
        }
      } catch (err) {
        alert("領域展開失敗：" + err.message);
      } finally {
        showLoading(false);
      }
    }

    // 渲染結果視圖
    function showResult(data) {
      clearInterval(timerInterval);
      switchView('result-view');
      
      document.getElementById('result-title').textContent = data.title;
      document.getElementById('res-img-A').src = data.imgA;
      document.getElementById('res-img-B').src = data.imgB;
      
      document.getElementById('res-votes-A').textContent = `${data.votesA} 票`;
      document.getElementById('res-votes-B').textContent = `${data.votesB} 票`;
      
      const total = data.votesA + data.votesB;
      const pctA = total === 0 ? 0 : (data.votesA / total) * 100;
      const pctB = total === 0 ? 0 : (data.votesB / total) * 100;

      // 添加一點延遲讓進度條有動畫感
      setTimeout(() => {
        document.getElementById('bar-A').style.width = pctA + '%';
        document.getElementById('bar-B').style.width = pctB + '%';
      }, 100);
    }
  </script>
</body>
</html>
